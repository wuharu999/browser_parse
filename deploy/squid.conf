# Squid ACL syntax: https://www.squid-cache.org/Doc/config/acl/
# Replace provider domains here before deployment. Keep this list exact and small.
http_port 3128
visible_hostname robot-egress-proxy
cache deny all
pinger_enable off
access_log stdio:/dev/stdout
cache_log /dev/stderr

acl Safe_ports port 443
acl CONNECT method CONNECT
http_access deny !Safe_ports
http_access deny CONNECT !Safe_ports
http_access deny !CONNECT

# Never proxy link-local, loopback, RFC1918, or other internal destinations.
acl localnet dst 0.0.0.0/8
acl localnet dst 10.0.0.0/8
acl localnet dst 100.64.0.0/10
acl localnet dst 127.0.0.0/8
acl localnet dst 169.254.0.0/16
acl localnet dst 172.16.0.0/12
acl localnet dst 192.0.0.0/24
acl localnet dst 192.0.2.0/24
acl localnet dst 192.168.0.0/16
acl localnet dst 198.18.0.0/15
acl localnet dst 198.51.100.0/24
acl localnet dst 203.0.113.0/24
acl localnet dst fc00::/7
acl localnet dst fe80::/10
acl localnet dst ::1
http_access deny localnet

# Provider endpoints used by the job image. Add only configured HTTPS providers.
acl allowed_providers dstdomain -n api.deepseek.com
http_access allow CONNECT allowed_providers
http_access deny all
